services:
  # Frontend (Vite)
  - type: web
    name: votex-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: votex-backend
          type: web
          property: host
      - key: VITE_AI_SERVICE_URL
        fromService:
          name: votex-ai-service
          type: web
          property: host

  # Backend (Spring Boot)
  - type: web
    name: votex-backend
    env: docker
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: AI_SERVICE_URL
        fromService:
          name: votex-ai-service
          type: web
          property: host
      # Database env vars should be added in Render UI or here if using a Blueprint for DB
      - key: SPRING_DATASOURCE_URL
        value: ${DATABASE_URL} # Example if using a managed DB

  # AI Service (Python/Flask)
  - type: web
    name: votex-ai-service
    env: docker
    plan: free
    dockerContext: ai-service
    dockerfilePath: ai-service/Dockerfile
    envVars:
      - key: PORT
        value: 5001
